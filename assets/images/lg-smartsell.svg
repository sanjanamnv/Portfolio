<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="lgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="phoneScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E3A8A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#lgBg)"/>
  <circle cx="520" cy="90" r="130" fill="#3B82F6" opacity="0.08"/>
  <circle cx="80" cy="270" r="80" fill="#2563EB" opacity="0.08"/>

  <!-- Left: Service Analytics & Workflows Dashboard -->
  <g transform="translate(70, 50)">
    <rect width="260" height="260" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#phoneShadow)"/>
    
    <!-- Top badge -->
    <rect x="18" y="20" width="32" height="32" rx="8" fill="#DC2626"/>
    <text x="34" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">LG</text>
    
    <text x="60" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0F172A">SmartSell Portal</text>
    <text x="60" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Engineer Field Console</text>

    <!-- Field Ticket Metric -->
    <rect x="18" y="68" width="224" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="30" y="90" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">ACTIVE SERVICE TICKET</text>
    <text x="30" y="108" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Inverter AC Compressor Check</text>
    <rect x="180" y="80" width="52" height="20" rx="4" fill="#DCFCE7"/>
    <text x="206" y="94" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">Assigned</text>

    <!-- Sales Opportunities Upsell card -->
    <rect x="18" y="140" width="224" height="64" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="30" y="160" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1D4ED8">UPGRADE OPPORTUNITY</text>
    <text x="30" y="178" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Extended Warranty + AMC</text>
    <text x="30" y="194" font-family="system-ui, sans-serif" font-size="10" fill="#3B82F6">Estimated Commission: +18%</text>

    <!-- Action buttons -->
    <rect x="18" y="216" width="108" height="28" rx="6" fill="#2563EB"/>
    <text x="72" y="234" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Diagnostic Scan</text>
    
    <rect x="134" y="216" width="108" height="28" rx="6" fill="#F1F5F9"/>
    <text x="188" y="234" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Generate Quote</text>
  </g>

  <!-- Right: Mobile Device Frame (Flutter App) -->
  <g transform="translate(365, 30)" filter="url(#phoneShadow)">
    <!-- Smartphone Bezel -->
    <rect width="165" height="300" rx="28" fill="#020617" stroke="#334155" stroke-width="4"/>
    
    <!-- Phone Screen -->
    <rect x="8" y="8" width="149" height="284" rx="22" fill="url(#phoneScreenGrad)"/>

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="58" y="14" width="49" height="10" rx="5" fill="#000000"/>

    <!-- Mobile UI Content -->
    <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">LG Engineer</text>
    <circle cx="140" cy="40" r="4" fill="#22C55E"/>

    <!-- Quick stats in app -->
    <rect x="16" y="56" width="62" height="42" rx="6" fill="#1E293B"/>
    <text x="22" y="72" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Jobs Done</text>
    <text x="22" y="90" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#38BDF8">04 / 06</text>

    <rect x="85" y="56" width="64" height="42" rx="6" fill="#1E293B"/>
    <text x="91" y="72" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Leads</text>
    <text x="91" y="90" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FBBF24">$420</text>

    <!-- Workflow Item 1 -->
    <rect x="16" y="110" width="133" height="46" rx="6" fill="#334155"/>
    <circle cx="28" cy="133" r="5" fill="#38BDF8"/>
    <text x="40" y="128" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Ref: Smart ThinQ</text>
    <text x="40" y="142" font-family="system-ui, sans-serif" font-size="8" fill="#94A3B8">Telemetry: Normal</text>

    <!-- Workflow Item 2 -->
    <rect x="16" y="164" width="133" height="46" rx="6" fill="#1E293B"/>
    <circle cx="28" cy="187" r="5" fill="#F59E0B"/>
    <text x="40" y="182" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">OLED Panel Test</text>
    <text x="40" y="196" font-family="system-ui, sans-serif" font-size="8" fill="#94A3B8">Part Ordered</text>

    <!-- Bottom App Navigation Bar -->
    <rect x="8" y="248" width="149" height="44" rx="10" fill="#090D16"/>
    <circle cx="45" cy="270" r="4" fill="#38BDF8"/>
    <circle cx="82" cy="270" r="4" fill="#64748B"/>
    <circle cx="120" cy="270" r="4" fill="#64748B"/>
  </g>
</svg>
