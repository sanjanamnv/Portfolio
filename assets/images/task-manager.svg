<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="taskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <filter id="taskShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#065F46" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#taskBg)"/>
  <circle cx="500" cy="80" r="110" fill="#10B981" opacity="0.08"/>
  <circle cx="90" cy="280" r="80" fill="#059669" opacity="0.08"/>

  <!-- Main Kanban Board Canvas -->
  <g filter="url(#taskShadow)">
    <rect x="90" y="45" width="420" height="270" rx="16" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>

    <!-- App Header -->
    <rect x="90" y="45" width="420" height="48" rx="16" fill="#F0FDF4"/>
    <rect x="110" y="57" width="24" height="24" rx="6" fill="#059669"/>
    <path d="M116 69 L120 73 L128 65" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="144" y="73" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#064E3B">Student Task Manager</text>

    <!-- Progress indicator -->
    <rect x="360" y="60" width="130" height="18" rx="9" fill="#D1FAE5"/>
    <rect x="360" y="60" width="95" height="18" rx="9" fill="#10B981"/>
    <text x="425" y="73" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#064E3B" text-anchor="middle">75% Completed</text>

    <!-- Kanban Columns -->
    <!-- Column 1: In Progress -->
    <g transform="translate(110, 105)">
      <rect width="185" height="190" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">IN PROGRESS (2)</text>
      
      <!-- Card 1 -->
      <rect x="12" y="36" width="161" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="20" y="46" width="56" height="14" rx="4" fill="#E0E7FF"/>
      <text x="48" y="57" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#4338CA" text-anchor="middle">CSE Lab</text>
      <text x="20" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Database Normalization</text>
      <text x="20" y="90" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Due: Tomorrow 5 PM</text>

      <!-- Card 2 -->
      <rect x="12" y="110" width="161" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="20" y="120" width="60" height="14" rx="4" fill="#FEF3C7"/>
      <text x="50" y="131" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#B45309" text-anchor="middle">Seminar</text>
      <text x="20" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Cloud Architectures</text>
      <text x="20" y="164" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Slides: 8 / 12 ready</text>
    </g>

    <!-- Column 2: Completed -->
    <g transform="translate(305, 105)">
      <rect width="185" height="190" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803D">COMPLETED (3)</text>
      
      <!-- Completed Card 1 -->
      <rect x="12" y="36" width="161" height="64" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
      <path d="M22 55 L26 59 L34 51" stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="40" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Java OOP Assignment</text>
      <text x="40" y="72" font-family="system-ui, sans-serif" font-size="9" fill="#16A34A">Submitted on portal</text>
      <text x="40" y="88" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Score pending</text>

      <!-- Completed Card 2 -->
      <rect x="12" y="110" width="161" height="64" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
      <path d="M22 129 L26 133 L34 125" stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="40" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E293B">DSA Quiz 2</text>
      <text x="40" y="146" font-family="system-ui, sans-serif" font-size="9" fill="#16A34A">Completed · 95%</text>
    </g>
  </g>
</svg>
