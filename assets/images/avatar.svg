<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7D6"/>
      <stop offset="100%" stop-color="#F3C6A5"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1F3F"/>
      <stop offset="100%" stop-color="#1A1224"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Circular Backdrop with subtle border -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" opacity="0.12" />
  <circle cx="200" cy="200" r="175" fill="#FFFFFF" class="avatar-bg-circle" />

  <!-- Abstract decorative tech accent rings -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="#C084FC" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>
  <circle cx="200" cy="200" r="145" fill="url(#bgGrad)" opacity="0.08"/>

  <!-- Character Group -->
  <g filter="url(#shadow)">
    <!-- Hair Back -->
    <path d="M125 150 Q110 240 135 285 Q200 300 265 285 Q290 240 275 150 Q200 80 125 150 Z" fill="url(#hairGrad)"/>
    <path d="M110 210 Q95 280 140 310 Q160 320 180 320 L130 240 Z" fill="url(#hairGrad)"/>
    <path d="M290 210 Q305 280 260 310 Q240 320 220 320 L270 240 Z" fill="url(#hairGrad)"/>

    <!-- Shoulders & Hoodie -->
    <path d="M115 350 C115 305 145 280 170 270 L200 295 L230 270 C255 280 285 305 285 350 C285 365 270 380 200 380 C130 380 115 365 115 350 Z" fill="url(#hoodieGrad)"/>
    
    <!-- Inner Hoodie Collar / Neck -->
    <path d="M182 250 L218 250 L224 285 L200 300 L176 285 Z" fill="url(#skinGrad)"/>
    <path d="M182 280 Q200 295 218 280 L222 290 Q200 310 178 290 Z" fill="#E2A682" opacity="0.4"/>

    <!-- Head & Face -->
    <path d="M145 165 C145 115 160 100 200 100 C240 100 255 115 255 165 C255 215 240 252 200 252 C160 252 145 215 145 165 Z" fill="url(#skinGrad)"/>

    <!-- Hair Front / Bangs -->
    <path d="M142 155 C145 115 170 95 200 95 C230 95 255 115 258 155 C242 125 215 120 200 125 C180 120 155 130 142 155 Z" fill="url(#hairGrad)"/>
    <path d="M143 148 C140 175 130 205 135 235 C140 210 148 185 152 165 Z" fill="url(#hairGrad)"/>
    <path d="M257 148 C260 175 270 205 265 235 C260 210 252 185 248 165 Z" fill="url(#hairGrad)"/>

    <!-- Modern Stylish Glasses -->
    <rect x="156" y="152" width="34" height="26" rx="8" fill="none" stroke="#7C3AED" stroke-width="3.5"/>
    <rect x="210" y="152" width="34" height="26" rx="8" fill="none" stroke="#7C3AED" stroke-width="3.5"/>
    <path d="M190 163 L210 163" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M156 161 L145 158" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <path d="M244 161 L255 158" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes Behind Lenses -->
    <ellipse cx="173" cy="165" rx="5" ry="4" fill="#1E1B4B"/>
    <circle cx="175" cy="163" r="1.5" fill="#FFFFFF"/>
    <ellipse cx="227" cy="165" rx="5" ry="4" fill="#1E1B4B"/>
    <circle cx="229" cy="163" r="1.5" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <path d="M162 144 Q173 140 184 144" stroke="#2D1F3F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M216 144 Q227 140 238 144" stroke="#2D1F3F" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Nose & Warm Smile -->
    <path d="M198 178 Q200 185 204 185" stroke="#D99B77" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M188 202 Q200 216 212 202" stroke="#E11D48" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Subtle Cheeks -->
    <circle cx="158" cy="188" r="7" fill="#FB7185" opacity="0.35"/>
    <circle cx="242" cy="188" r="7" fill="#FB7185" opacity="0.35"/>

    <!-- Tech / Laptop Edge in front -->
    <path d="M150 345 L250 345 L265 375 L135 375 Z" fill="#E2E8F0"/>
    <path d="M155 348 L245 348 L257 372 L143 372 Z" fill="#1E293B"/>
    <!-- Small glowing code symbol on laptop lid/screen -->
    <text x="200" y="364" font-family="monospace" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Small floating decorative tech icons/sparkles -->
  <g fill="#FB923C">
    <circle cx="95" cy="130" r="4" />
    <path d="M95 118 L98 126 L106 126 L100 131 L102 139 L95 134 L88 139 L90 131 L84 126 L92 126 Z" fill="#F59E0B" opacity="0.8" transform="scale(0.8) translate(25, 25)"/>
  </g>
  <g fill="#7C3AED" opacity="0.85">
    <circle cx="310" cy="115" r="5" fill="#8B5CF6"/>
    <text x="312" y="160" font-family="monospace" font-size="18" font-weight="bold" fill="#7C3AED">&#123; &#125;</text>
    <text x="70" y="240" font-family="monospace" font-size="16" font-weight="bold" fill="#EC4899">#</text>
  </g>
</svg>
