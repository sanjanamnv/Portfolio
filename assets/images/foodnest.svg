<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C2D12" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#foodBg)"/>
  
  <!-- Subtle decorative patterns -->
  <circle cx="530" cy="70" r="120" fill="#F97316" opacity="0.08"/>
  <circle cx="80" cy="300" r="90" fill="#EA580C" opacity="0.06"/>
  <circle cx="100" cy="60" r="12" fill="#FB923C" opacity="0.3"/>
  <circle cx="510" cy="280" r="8" fill="#F97316" opacity="0.25"/>

  <!-- Main FoodNest Device / Card Mockup -->
  <g filter="url(#cardShadow)">
    <!-- App Canvas Frame -->
    <rect x="90" y="45" width="420" height="270" rx="16" fill="url(#cardGrad)" stroke="#FDBA74" stroke-width="1.5"/>

    <!-- App Header Bar -->
    <rect x="90" y="45" width="420" height="52" rx="16" fill="#FFFFFF"/>
    <!-- Logo Badge -->
    <rect x="114" y="58" width="26" height="26" rx="6" fill="#F97316"/>
    <path d="M121 72 Q127 64 133 72" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="148" y="75" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#431407">FoodNest</text>
    
    <!-- Header search bar pill -->
    <rect x="240" y="58" width="180" height="26" rx="13" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
    <circle cx="255" cy="71" r="4.5" fill="none" stroke="#EA580C" stroke-width="1.5"/>
    <line x1="258" y1="74" x2="263" y2="79" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round"/>
    <text x="272" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#9A3412">Search tasty food...</text>

    <!-- Cart Button icon -->
    <rect x="445" y="56" width="30" height="30" rx="8" fill="#EA580C"/>
    <path d="M453 64 L456 64 L460 74 L467 74 L470 67 L458 67" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="461" cy="77" r="1.5" fill="#FFFFFF"/>
    <circle cx="466" cy="77" r="1.5" fill="#FFFFFF"/>

    <!-- Content Split: Hero Promo on Left, Interactive Dish on Right -->
    <g transform="translate(115, 115)">
      <!-- Left Promotional Banner -->
      <rect width="185" height="175" rx="12" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="1"/>
      <text x="16" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#EA580C">TODAY'S SPECIAL</text>
      <text x="16" y="56" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1C1917">Fresh Asian Bowl</text>
      <text x="16" y="76" font-family="system-ui, sans-serif" font-size="11" fill="#78716C">Steamed veggies &amp; herbs</text>
      <text x="16" y="106" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#EA580C">$12.50</text>
      
      <!-- Order Now Button -->
      <rect x="16" y="125" width="110" height="32" rx="6" fill="#EA580C"/>
      <text x="71" y="145" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Order Now</text>
    </g>

    <!-- Right: Illustrated Gourmet Food Bowl -->
    <g transform="translate(325, 115)">
      <rect width="165" height="175" rx="12" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1"/>
      <!-- Shadow under bowl -->
      <ellipse cx="82" cy="115" rx="55" ry="14" fill="#000000" opacity="0.08"/>
      <!-- Bowl base -->
      <path d="M35 80 C35 125 130 125 130 80 Z" fill="url(#bowlGrad)"/>
      <ellipse cx="82" cy="80" rx="48" ry="15" fill="#FED7AA"/>
      <!-- Food inside bowl: Avocado, tomatoes, greens -->
      <ellipse cx="72" cy="78" rx="20" ry="8" fill="#65A30D"/>
      <circle cx="68" cy="76" r="5" fill="#DC2626"/>
      <circle cx="85" cy="78" r="4.5" fill="#EA580C"/>
      <circle cx="96" cy="74" r="6" fill="#FBBF24"/>
      <ellipse cx="85" cy="70" rx="14" ry="5" fill="#84CC16"/>
      
      <!-- Steaming aroma waves -->
      <path d="M72 56 Q76 46 72 38" stroke="#FB923C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path d="M84 52 Q88 42 84 34" stroke="#FB923C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M96 56 Q100 46 96 38" stroke="#FB923C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

      <!-- Delivery time badge -->
      <rect x="25" y="135" width="115" height="24" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
      <text x="82" y="151" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400E" text-anchor="middle">⚡ Delivery: 20-25 mins</text>
    </g>
  </g>
</svg>
